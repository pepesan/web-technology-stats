# Ajustes del kernel para escanear con muchas conexiones simultáneas (web-technology-stats).
# Se instala con:  sudo ./host/aplicar_sysctl.sh        (--dry-run para ver el cambio sin aplicarlo)
# Se revierte con: sudo ./host/aplicar_sysctl.sh --revert
#
# Hoy (10 núcleos, ~300 sitios/min por proceso) no hace falta; es un seguro para escalar más de 10 veces.

# Puertos efímeros: más puertos para conexiones de salida (por defecto 32768-60999). Muchos dominios
# comparten IP (Cloudflare, Google...) y el límite de puertos es por IP+puerto de destino.
# Se parte de 20000 y se reservan los puertos de servicios locales que caen dentro del rango
# (27017 = MongoDB), para que el kernel no se los dé a una conexión de salida y no puedan reiniciarse.
net.ipv4.ip_local_port_range = 20000 65535
net.ipv4.ip_local_reserved_ports = 27017,30000,30002

# Reutiliza sockets en TIME_WAIT para conexiones de salida (por defecto 2 = solo loopback) y los libera antes.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 30

# Tabla de seguimiento de conexiones (solo existe con el módulo nf_conntrack cargado, p. ej. con Docker).
net.netfilter.nf_conntrack_max = 1048576

# OPCIONAL, afecta a todo el host (también a las VMs): MongoDB recomienda swappiness bajo.
# vm.swappiness = 1
