server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 512;

    # El flag de fuente se genera al arrancar el contenedor: nunca cacheado.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Los informes cambian al publicar una imagen nueva: revalidar siempre (ETag).
    location /reports/ {
        add_header Cache-Control "no-cache";
    }

    # Ficheros compilados con hash en el nombre: cacheables para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
