[project]
name = "web-technology-stats"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bokeh>=3.9.2",
    "click>=8.3.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "mongoengine>=0.29.3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "pymongo>=4.19.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "selenium>=4.51.0",
    "squarify>=0.4.5",
    "tldextract>=5.4.0",
]

[project.scripts]
webtechstats = "webtechstats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webtechstats"]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8.4.0",
    "responses>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
